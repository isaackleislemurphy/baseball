[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
# Exclude standard build/env directories to speed up formatting
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.env
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
# "profile = black" is necessary to stop isort from fighting with Black
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true